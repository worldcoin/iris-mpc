name: Check public key checksums

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Validate public key registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # pin@v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Always report this job so it can be required without blocking unrelated
      # PRs on a path-filtered workflow that never starts.
      - name: Detect registry changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # A new branch or unavailable pre-force-push commit must run validation.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          if git diff --quiet --no-renames "$BASE_SHA" "$HEAD_SHA" -- \
            keys.json certs/ scripts/check-key-checksums.py \
            scripts/tests/test_check_key_checksums.py .github/workflows/check-key-checksums.yaml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 1 ]]; then
              exit "$status"
            fi
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test checksum validator
        if: steps.changes.outputs.relevant == 'true'
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_key_checksums.py'

      - name: Verify every public key location
        if: steps.changes.outputs.relevant == 'true'
        # Own-repository main URLs use files in the checkout, including PR changes.
        run: python3 scripts/check-key-checksums.py keys.json --repository "$GITHUB_REPOSITORY" --repo-root "$GITHUB_WORKSPACE"

      - name: No registry changes
        if: steps.changes.outputs.relevant == 'false'
        run: echo "No registry, certificate, validator, test, or workflow changes to validate."
