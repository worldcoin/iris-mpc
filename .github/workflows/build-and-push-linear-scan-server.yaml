name: Build and push image for iris-mpc-linear-scan

on:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "${{ github.repository }}-linear-scan"

jobs:
  docker:
    name: Build and push arm64 image
    timeout-minutes: 40
    runs-on:
      labels: arm64-ubuntu-22.04-16core
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Install Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.7.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to the container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
            echo "${REGISTRY}/${IMAGE_NAME}:latest"
            if [ -n "${RELEASE_TAG_NAME}" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG_NAME}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/arm64
          build-args: |
            ARCHITECTURE=aarch64
          cache-from: type=gha,scope=linear-scan-arm64
          cache-to: type=gha,mode=max,scope=linear-scan-arm64
          file: Dockerfile.arm64.linear-scan
