replicaCount: 0
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
image: ghcr.io/worldcoin/iris-mpc-linear-scan-amd64:b5db8b96e90e513d4abd3d9264cf6077a5a3970e@sha256:d6e400bffcfd6aa607248b6fcb50c1f96652d85f869d4184d76a258a15cc21ff
env:
  SMPC__SHARES_BUCKET_NAME: "wf-ampc-stage-sns-requests"
  SMPC__SHARES_BUCKET_REGION: "eu-central-1"
  SMPC__MAX_DB_SIZE: "18000000"
  SMPC__CPU_CELL__DEPLOYMENT_ID: 60173f3c-2019-4089-b26c-4052b3532841
  SMPC__CPU_CELL__PEERS__SLOT: a
  SMPC__CPU_CELL__PEERS__A: "[\"http://pod-a.0.stage.hnsw.worldcoin.dev:3090/handoff-status\",\"http://pod-a.1.stage.hnsw.worldcoin.dev:3090/handoff-status\",\"http://pod-a.2.stage.hnsw.worldcoin.dev:3090/handoff-status\"]"
  SMPC__CPU_CELL__PEERS__B: "[\"http://pod-b.0.stage.hnsw.worldcoin.dev:3090/handoff-status\",\"http://pod-b.1.stage.hnsw.worldcoin.dev:3090/handoff-status\",\"http://pod-b.2.stage.hnsw.worldcoin.dev:3090/handoff-status\"]"
  SMPC__SERVICE__SERVICE_NAME: cpu-cell-a-1
  SMPC__SERVICE__METRICS__PREFIX: cpu-cell-a-1
  SMPC__SERVER_COORDINATION__NODE_HOSTNAMES: "[\"pod-a.0.stage.hnsw.worldcoin.dev\",\"0.0.0.0\",\"pod-a.2.stage.hnsw.worldcoin.dev\"]"
  SMPC__SCHEMA_NAME: POP4401_17M_a20261006
  SMPC__ENABLE_S3_IMPORTER: "true"
  SMPC__DB_CHUNKS_FOLDER_NAME: pop4381/17m/export-v1
  SMPC__STARTUP_MODE: active
startupProbe:
  exec: null
  httpGet:
    path: /ready
    port: health
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 120
initContainer:
  env:
    - name: PARTY_ID
      value: "1"
    - name: CELL_SLOT
      value: a
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
resources:
  requests:
    cpu: "92"
    memory: 698Gi
  limits:
    cpu: "92"
    memory: 698Gi
nodeSelector:
  node.kubernetes.io/instance-type: r8i.24xlarge
livenessProbe:
  exec: null
  httpGet:
    path: /health
    port: health
readinessProbe:
  exec: null
  httpGet:
    path: /ready
    port: health
