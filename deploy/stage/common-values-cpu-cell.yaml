# Applied after the existing common and per-party ampc-hnsw values.
# Slots stay disabled and passive until a compatible release and handoff are reviewed.
replicaCount: 0
image: "ghcr.io/worldcoin/iris-mpc-linear-scan-amd64:530e70eb253b1787dc4bfeddbf70d427018298e4@sha256:e300189e96867a9938ff4637d5e1bd4b46b3df9e3f666b1eb6393c4b0b811c57"

serviceAccount:
  create: false
  name: ampc-hnsw

service:
  enabled: false

env:
  SMPC__STARTUP_MODE: "candidate"
  SMPC__ENABLE_S3_IMPORTER: "false"
  SMPC__DATABASE__MIGRATE: "false"
  SMPC__DATABASE__CREATE: "false"
  SMPC__CLEAR_DB_BEFORE_INIT: "false"
  SMPC__INIT_DB_SIZE: "0"
  SMPC__FAKE_DB_SIZE: "0"
  SMPC__CANDIDATE_STATUS_PORT: "3090"

# Candidate status is loopback-only. Never add this port to a Service.
livenessProbe:
  httpGet: null
  exec:
    command: ["curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:3090/health"]
  timeoutSeconds: 3

readinessProbe:
  httpGet: null
  exec:
    command: ["curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:3090/ready"]
  timeoutSeconds: 3

startupProbe:
  httpGet: null
  exec:
    command: ["curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:3090/startup"]
  timeoutSeconds: 3
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 366

initContainer:
  name: cpu-cell-dns
  configMap:
    init.sh: |
      #!/usr/bin/env bash
      set -euo pipefail
      export AWS_MAX_ATTEMPTS=1
      case "$PARTY_ID" in 0|1|2) ;; *) echo "Invalid party" >&2; exit 1;; esac
      case "$CELL_SLOT" in a|b) ;; *) echo "Invalid cell slot" >&2; exit 1;; esac
      if [[ ! "$POD_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
        echo "Expected an IPv4 pod address" >&2
        exit 1
      fi
      ZONE_NAME="$PARTY_ID.stage.hnsw.worldcoin.dev"
      RECORD_NAME="pod-$CELL_SLOT.$ZONE_NAME"
      ZONE_ID=$(aws route53 list-hosted-zones-by-name \
        --dns-name "$ZONE_NAME" \
        --query "HostedZones[?Name == '$ZONE_NAME.'] | [0].Id" \
        --output text --cli-connect-timeout 10 --cli-read-timeout 30)
      if [[ -z "$ZONE_ID" || "$ZONE_ID" == "None" ]]; then
        echo "No exact hosted zone for $ZONE_NAME" >&2
        exit 1
      fi
      # Names and values are restricted to the validated slot, party, IPv4 and UUID alphabets.
      rr() {
        printf '{"Name":"%s","Type":"%s","TTL":5,"ResourceRecords":[{"Value":"%s"}]}' "$RECORD_NAME" "$1" "$2"
      }
      change() { printf '{"Action":"%s","ResourceRecordSet":%s}' "$1" "$2"; }
      submit() {
        local IFS=,
        aws route53 change-resource-record-sets --hosted-zone-id "$ZONE_ID" \
          --change-batch "{\"Changes\":[$*]}" --query ChangeInfo.Id --output text \
          --cli-connect-timeout 10 --cli-read-timeout 30
      }
      valid_id() {
        [[ $1 =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ && $1 != 00000000-0000-0000-0000-000000000000 ]]
      }
      address=$(rr A "$POD_IP")
      if [[ -z ${DNS_DEPLOYMENT_ID+x} && -z ${DNS_PREVIOUS_DEPLOYMENT_ID+x} ]]; then
        CHANGE_ID=$(submit "$(change CREATE "$address")")
      else
        valid_id "${DNS_DEPLOYMENT_ID:-}" || { echo "Invalid DNS_DEPLOYMENT_ID for $RECORD_NAME" >&2; exit 1; }
        owner=$(rr TXT "\\\"$DNS_DEPLOYMENT_ID\\\"")
        if [[ -n ${DNS_PREVIOUS_DEPLOYMENT_ID+x} ]]; then
          if ! valid_id "$DNS_PREVIOUS_DEPLOYMENT_ID" || [[ $DNS_DEPLOYMENT_ID == "$DNS_PREVIOUS_DEPLOYMENT_ID" ]]; then
            echo "Invalid DNS_PREVIOUS_DEPLOYMENT_ID for $RECORD_NAME" >&2; exit 1
          fi
          previous=$(rr TXT "\\\"$DNS_PREVIOUS_DEPLOYMENT_ID\\\"")
          claim=("$(change DELETE "$previous")" "$(change CREATE "$owner")" "$(change UPSERT "$address")")
        else
          claim=("$(change CREATE "$address")" "$(change CREATE "$owner")")
        fi
        # After an exact-match conflict, a retry can succeed only if both records already match.
        if ! CHANGE_ID=$(submit "${claim[@]}" 2>&1); then
          case "$CHANGE_ID" in
            *"An error occurred (InvalidChangeBatch) when calling the ChangeResourceRecordSets operation:"*) ;;
            *) echo "DNS claim failed for $RECORD_NAME: $CHANGE_ID" >&2; exit 1;;
          esac
          CHANGE_ID=$(submit "$(change DELETE "$owner")" "$(change CREATE "$owner")" \
                             "$(change DELETE "$address")" "$(change CREATE "$address")") || {
            echo "Could not verify the current owner and IP for $RECORD_NAME" >&2; exit 1
          }
        fi
      fi
      if [[ -z "$CHANGE_ID" || "$CHANGE_ID" == "None" ]]; then
        echo "Missing Route53 change ID for $RECORD_NAME; inspect before retrying" >&2
        exit 1
      fi
      timeout --signal=TERM --kill-after=10s 180s \
        aws route53 wait resource-record-sets-changed --id "$CHANGE_ID" \
        --cli-connect-timeout 10 --cli-read-timeout 30
