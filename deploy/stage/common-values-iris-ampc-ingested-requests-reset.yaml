image: "ghcr.io/worldcoin/retention-reaper:530e70eb253b1787dc4bfeddbf70d427018298e4@sha256:3bddbd9e9e3e9ceb501a62d8031ced9ead2a48c2ffae05826e11b9e94e080909"

environment: stage
replicaCount: 1
suspend: true
schedule: "58 10 * * *"
concurrencyPolicy: Forbid
backoffLimit: 0

env:
  RETENTION__ENABLED: "true"
  RETENTION__DRY_RUN: "false"
  RETENTION_JOBS: >-
    [{"table":"ingested_requests","ts_column":"received_at","retention":"0 seconds",
    "batch_size":2000,"batch_pause_ms":250}]

imagePullSecrets:
  - name: github-secret

resources:
  limits:
    cpu: "500m"
    memory: 256Mi
  requests:
    cpu: "100m"
    memory: 128Mi

nodeSelector:
  kubernetes.io/arch: amd64
