image: "ghcr.io/worldcoin/retention-reaper:5458a567a6b2b6a60e070e8e71486a66a9f10b72@sha256:06f4daa902d6d4b4b814dbe88b3752fd3cce1bbd6cdbcc9b095ae5b336c638f1"

environment: stage
replicaCount: 1
suspend: true
schedule: "58 10 * * *"
concurrencyPolicy: Forbid
backoffLimit: 0

env:
  RETENTION__ENABLED: "true"
  RETENTION__DRY_RUN: "false"
  RETENTION_JOBS: >-
    [{"table":"ingested_requests","ts_column":"received_at","retention":"0 seconds",
    "batch_size":2000,"batch_pause_ms":250}]

imagePullSecrets:
  - name: github-secret

resources:
  limits:
    cpu: "500m"
    memory: 256Mi
  requests:
    cpu: "100m"
    memory: 128Mi

nodeSelector:
  kubernetes.io/arch: amd64
