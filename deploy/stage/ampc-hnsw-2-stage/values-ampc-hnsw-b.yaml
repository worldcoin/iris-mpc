replicaCount: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
image: "ghcr.io/worldcoin/iris-mpc-linear-scan-amd64:afba70d6130c85c83c800e9dd500e47d84d29688@sha256:4b59f49f9026c52804432454457c39bdb47ca45be7b3b1637747d22b59e76a69"

env:
  SMPC__MAX_DB_SIZE: "125000"
  SMPC__CPU_CELL__DEPLOYMENT_ID: "29c0fab7-7110-4cdc-8e73-be2c5d09d1ab"
  SMPC__CPU_CELL__PEERS__SLOT: "b"
  SMPC__CPU_CELL__PEERS__A: '["http://pod-a.0.stage.hnsw.worldcoin.dev:3090/handoff-status","http://pod-a.1.stage.hnsw.worldcoin.dev:3090/handoff-status","http://pod-a.2.stage.hnsw.worldcoin.dev:3090/handoff-status"]'
  SMPC__CPU_CELL__PEERS__B: '["http://pod-b.0.stage.hnsw.worldcoin.dev:3090/handoff-status","http://pod-b.1.stage.hnsw.worldcoin.dev:3090/handoff-status","http://pod-b.2.stage.hnsw.worldcoin.dev:3090/handoff-status"]'
  SMPC__CPU_CELL__HANDOFF__ID: "39975519-1264-44e5-8b7e-903663db43ea"
  SMPC__CPU_CELL__HANDOFF__SOURCE_DEPLOYMENT_ID: "41abbd40-6443-4f3f-9f6c-042f0daef43c"
  SMPC__CPU_CELL__HANDOFF__SOURCE_STATUS_URLS: '["http://pod-a.0.stage.hnsw.worldcoin.dev:3000/handoff-status","http://pod-a.1.stage.hnsw.worldcoin.dev:3000/handoff-status","http://pod-a.2.stage.hnsw.worldcoin.dev:3000/handoff-status"]'
  SMPC__SERVICE__SERVICE_NAME: "cpu-cell-b-2"
  SMPC__SERVICE__METRICS__PREFIX: "cpu-cell-b-2"
  SMPC__SERVER_COORDINATION__NODE_HOSTNAMES: '["pod-b.0.stage.hnsw.worldcoin.dev","pod-b.1.stage.hnsw.worldcoin.dev","0.0.0.0"]'

startupProbe:
  failureThreshold: 420

initContainer:
  env:
    - name: PARTY_ID
      value: "2"
    - name: CELL_SLOT
      value: "b"
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
