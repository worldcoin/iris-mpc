env:
  SMPC__STARTUP_MODE: "candidate"
  SMPC__SCHEMA_NAME: "POP4401_17M_a20261006"
  SMPC__MAX_DB_SIZE: "18000000"
  SMPC__ENABLE_S3_IMPORTER: "true"
  SMPC__DB_CHUNKS_FOLDER_NAME: "pop4381/17m/export-v1"
  SMPC__SERVICE__SERVICE_NAME: "cpu-cell-preload-2"
  SMPC__SERVICE__METRICS__PREFIX: "cpu-cell-preload-2"

resources:
  requests: {cpu: "92", memory: 698Gi}
  limits: {cpu: "92", memory: 698Gi}

nodeSelector:
  node.kubernetes.io/instance-type: r8i.24xlarge

initContainer:
  enabled: false
