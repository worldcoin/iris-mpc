env:
  SMPC__SERVICE__SERVICE_NAME: "cpu-cell-a-0"
  SMPC__SERVICE__METRICS__PREFIX: "cpu-cell-a-0"
  SMPC__SERVER_COORDINATION__NODE_HOSTNAMES: '["0.0.0.0","pod-a.1.stage.hnsw.worldcoin.dev","pod-a.2.stage.hnsw.worldcoin.dev"]'

initContainer:
  env:
