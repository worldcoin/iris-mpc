# Exact CPU linear scan deployment. This is an alternative to, not a
# replacement for, common-values-iris-mpc.yaml (the CUDA deployment).
# Pin `image` to the release digest before a production rollout.
image: "ghcr.io/worldcoin/iris-mpc-linear-scan:latest"

environment: prod
replicaCount: 1

env:
  RUST_LOG: "info"
  RUST_BACKTRACE: "1"
  SMPC__ENVIRONMENT: "prod"
  SMPC__SERVICE__SERVICE_NAME: "smpcv2-linear-scan-server-prod"
  SMPC__SCHEMA_NAME: "SMPC_rerand"
  SMPC__DATABASE__URL:
    valueFrom:
      secretKeyRef:
        key: DATABASE_AURORA_URL
        name: application
  SMPC__DATABASE__MIGRATE: "true"
  SMPC__DATABASE__CREATE: "true"
  SMPC__DATABASE__LOAD_PARALLELISM: "8"
  SMPC__ANON_STATS_DATABASE__URL:
    valueFrom:
      secretKeyRef:
        key: DATABASE_AURORA_URL
        name: application
  SMPC__ANON_STATS_DATABASE__MIGRATE: "true"
  SMPC__ANON_STATS_DATABASE__CREATE: "true"
  SMPC__ANON_STATS_DATABASE__LOAD_PARALLELISM: "8"
  SMPC__AWS__REGION: "eu-north-1"
  SMPC__REQUESTS_QUEUE_URL:
    valueFrom:
      secretKeyRef:
        key: SQS_URL
        name: application
  SMPC__RESULTS_TOPIC_ARN:
    valueFrom:
      secretKeyRef:
        key: SNS_RESULTS_ARN
        name: application
  SMPC__PROCESSING_TIMEOUT_SECS: "600"
  SMPC__HEARTBEAT_INTERVAL_SECS: "2"
  SMPC__HEARTBEAT_INITIAL_RETRIES: "65"
  SMPC__PATH: "/data/"
  SMPC__KMS_KEY_ARNS:
    valueFrom:
      secretKeyRef:
        key: KMS_KEYS
        name: application
  SMPC__SERVER_COORDINATION__IMAGE_NAME: $(IMAGE_NAME)
  SMPC__SERVER_COORDINATION__HEARTBEAT_INITIAL_RETRIES: "65"
  SMPC__SERVER_COORDINATION__HEARTBEAT_INTERVAL_SECS: "3"
  SMPC__PUBLIC_KEY_BASE_URL: "https://pki-smpc.worldcoin.org"
  SMPC__SHARES_BUCKET_NAME: "wf-mpc-prod-smpcv2-sns-requests"
  SMPC__ENABLE_S3_IMPORTER: "true"
  SMPC__DB_CHUNKS_FOLDER_NAME: "even_odd_with_version_id_output_16k_rerandomized"
  SMPC__LOAD_CHUNKS_PARALLELISM: "64"
  SMPC__LOAD_CHUNKS_BUFFER_SIZE: "1024"
  SMPC__CLEAR_DB_BEFORE_INIT: "true"
  SMPC__INIT_DB_SIZE: "0"
  SMPC__MAX_DB_SIZE: "18000000"
  SMPC__FAKE_DB_SIZE: "0"
  # Linear scan serializes requests. This makes the preceding mutation visible
  # before the next scan and removes the need for intra-batch matching.
  SMPC__MAX_BATCH_SIZE: "1"
  # The measured r8g.24xlarge setup uses 144 search sessions per orientation
  # (3 * 48) over 16 TCP connections. Higher concurrency over-subscribes the
  # 85 dot-product cores when normal and mirror scans run together.
  SMPC__HAWK_REQUEST_PARALLELISM: "48"
  SMPC__HAWK_CONNECTION_PARALLELISM: "16"
  # CPUs 0-10 run Tokio/TLS; CPUs 11-95 run the dot-product workers. Keep this
  # in sync with the node irqbalance bootstrap configuration.
  SMPC__SEPARATE_TOKIO_CORES_PER_NODE: "11"
  # Only this eye is resident. Change this value on all three parties during a
  # coordinated restart when deliberately alternating the full-scan eye.
  SMPC__FULL_SCAN_SIDE: "Left"
  SMPC__FULL_SCAN_SIDE_SWITCHING_ENABLED: "false"
  SMPC__ENABLE_RESET: "true"
  SMPC__ENABLE_REAUTH: "true"
  SMPC__LUC_ENABLED: "true"
  SMPC__LUC_LOOKBACK_RECORDS: "500"
  # Older cold-eye supermatchers are retained by TinyLFU. One entry is about
  # 38.4 KiB per party, so 4096 entries consume roughly 150 MiB.
  SMPC__COLD_EYE_LFU_CACHE_RECORDS: "4096"
  SMPC__LUC_SERIAL_IDS_FROM_SMPC_REQUEST: "true"
  SMPC__SERVICE__METRICS__HOST:
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  SMPC__SERVICE__METRICS__PORT: "8125"
  SMPC__SERVICE__METRICS__QUEUE_SIZE: "5000"
  SMPC__SERVICE__METRICS__BUFFER_SIZE: "1024"
  SMPC__RETURN_PARTIAL_RESULTS: "true"
  SMPC__DISABLE_PERSISTENCE: "false"
  SMPC__MATCH_DISTANCES_BUFFER_SIZE_EXTRA_PERCENT: "50"
  SMPC__MATCH_DISTANCES_2D_BUFFER_SIZE: "1024"
  SMPC__ENABLE_MODIFICATIONS_SYNC: "true"
  SMPC__ENABLE_MODIFICATIONS_REPLAY: "true"
  SMPC__SERVICE_PORTS: '["4000","4001","4002"]'
  SMPC__TLS__PRIVATE_KEY: "/etc/ssl/private/key.pem"
  SMPC__TLS__LEAF_CERT: "/etc/ssl/private/certificate.crt"
  SMPC__TLS__ROOT_CERTS: '["/usr/local/share/ca-certificates/ca_smpcv2_party_prod_0.crt", "/usr/local/share/ca-certificates/ca_smpcv2_party_prod_1.crt", "/usr/local/share/ca-certificates/ca_smpcv2_party_prod_2.crt"]'

strategy:
  type: Recreate

datadog:
  enabled: true

hostNetwork: true

ports:
  - containerPort: 3000
    name: health
    protocol: TCP
  - containerPort: 4000
    name: tcp-4000
    protocol: TCP
  - containerPort: 4001
    name: tcp-4001
    protocol: TCP
  - containerPort: 4002
    name: tcp-4002
    protocol: TCP

livenessProbe:
  httpGet:
    path: /health
    port: health

readinessProbe:
  periodSeconds: 30
  httpGet:
    path: /ready
    port: health

startupProbe:
  initialDelaySeconds: 900
  failureThreshold: 120
  periodSeconds: 30
  httpGet:
    path: /ready
    port: health

resources:
  limits:
    memory: 700Gi
  requests:
    # No CPU limit: avoid CFS throttling on the dedicated 96-vCPU node.
    cpu: 92
    memory: 700Gi

imagePullSecrets:
  - name: github-secret

podAnnotations:
  karpenter.sh/do-not-disrupt: "true"

nodeSelector:
  kubernetes.io/arch: arm64
  karpenter.sh/capacity-type: on-demand
  node.kubernetes.io/instance-type: "r8g.24xlarge"
  workload: "iris-mpc-linear-scan"

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "linearScanGroup"
    effect: "NoSchedule"

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534

keelPolling:
  enabled: false

tmpDir:
  enabled: true
  size: 5Gi
  mountPath: /dev/shm

preStop:
  sleepPeriod: 10

terminationGracePeriodSeconds: 660

mountSSLCerts:
  enabled: true
  mountPath: /etc/ssl/private
