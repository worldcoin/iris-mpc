  SMPC__SERVICE__METRICS__PREFIX: "cpu-cell-a-0"
  SMPC__SERVER_COORDINATION__NODE_HOSTNAMES: '["0.0.0.0","pod-a.1.prod.hnsw.worldcoin.org","pod-a.2.prod.hnsw.worldcoin.org"]'

initContainer:
