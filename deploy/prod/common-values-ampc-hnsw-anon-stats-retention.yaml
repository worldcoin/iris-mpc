# POP-3905 — anon-stats retention CronJob (prod, ampc-hnsw). Mirrors the stage deploy
# (common-cronjob 1.11.0 via wf-cluster-apps); per-cluster env + the
# attachSecurityGroupPolicy that lets the pod reach the anon-stats Aurora live per-node.
# Stage-validated 2026-07-09 (see the smpcv2 common values for details).
image: "ghcr.io/worldcoin/retention-reaper:v0.32.6@sha256:366cc7dcd9e9132bbfe2b5719332ff8d1f301ed5b487cbfc458fbc97cca92ace"

# LIVE (POP-4134 flip, 2026-08-03): DRY_RUN=false — the guarded batched DELETE runs for
# real (10k-row ctid batches, 100ms pause, per-batch commit; concurrencyPolicy Forbid).
# First run drains the never-reaped backlog validated in dry-run (counts stepped at 07-31
# exactly when the 07-16 created_at backfill crossed the 14d horizon) — expect the
# POP-4136 runaway-deletion monitor (>1M rows/day) to fire once on that drain.
suspend: false

env:
  RETENTION__ENABLED: "true"
  RETENTION__DRY_RUN: "false"

replicaCount: 1

environment: prod

schedule: "30 3 * * *"
backoffLimit: 0

concurrencyPolicy: Forbid

imagePullSecrets:
  - name: github-secret

resources:
  limits:
    cpu: "500m"
    memory: 256Mi
  requests:
    cpu: "100m"
    memory: 128Mi

nodeSelector:
  kubernetes.io/arch: amd64
