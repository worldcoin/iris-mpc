image: "ghcr.io/worldcoin/iris-mpc-cpu:20d1c45bbee20672312a45101cec3b765df6f95b@sha256:15dbad33611f1f05c18c1556ea2a33ddb99bb02dcf47efd77f864606fd6c56d9"

environment: prod
schedule: "0 11 * * *"

env:
  ENV: "prod"
  AWS_REGION: "eu-central-1"
  RUST_LOG: "info"
  RUST_BACKTRACE: "full"
  SMPC__SERVICE__METRICS__HOST:
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  SMPC__SERVICE__METRICS__PORT: "8125"
  SMPC__SERVICE__METRICS__QUEUE_SIZE: "5000"
  SMPC__SERVICE__METRICS__BUFFER_SIZE: "256"
  SMPC__CPU_DATABASE__URL:
    valueFrom:
      secretKeyRef:
        key: DATABASE_AURORA_HNSW_URL
        name: application
  SMPC__TLS__PRIVATE_KEY: "/etc/ssl/private/key.pem"
  SMPC__TLS__LEAF_CERT: "/etc/ssl/private/certificate.crt"
  SMPC__TLS__ROOT_CERTS: '["/usr/local/share/ca-certificates/ca_party_prod_0.crt", "/usr/local/share/ca-certificates/ca_party_prod_1.crt", "/usr/local/share/ca-certificates/ca_party_prod_2.crt"]'

backoffLimit: 0
concurrencyPolicy: Forbid
activeDeadlineSeconds: 5400
ttlSecondsAfterFinished: 3600
restartPolicy: Never

command: ["/bin/wal-sidecar"]

imagePullSecrets:
  - name: github-secret

ports:
  - containerPort: 5000
    name: tcp-5000
    protocol: TCP
  - containerPort: 5001
    name: tcp-5001
    protocol: TCP
  - containerPort: 5002
    name: tcp-5002
    protocol: TCP

resources:
  limits:
    cpu: 15
    memory: 245Gi
  requests:
    cpu: 12
    memory: 220Gi

podAnnotations:
  karpenter.sh/do-not-disrupt: "true"

nodeSelector:
  kubernetes.io/arch: arm64
  karpenter.sh/capacity-type: on-demand
  node.kubernetes.io/instance-type: "x8g.4xlarge"

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534

terminationGracePeriodSeconds: 120

mountSSLCerts:
  enabled: true
  mountPath: /etc/ssl/private
