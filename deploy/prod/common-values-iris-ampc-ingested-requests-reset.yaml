image: "ghcr.io/worldcoin/retention-reaper:v0.32.14@sha256:437673d29cc89fb2a31771a0dccfb2018a1d044e6998b792daae21cedd4a52c8"

environment: prod
replicaCount: 1
suspend: true
schedule: "0 0 31 2 *"
concurrencyPolicy: Forbid
backoffLimit: 0

env:
  RETENTION__ENABLED: "true"
  RETENTION__DRY_RUN: "false"
  RETENTION_JOBS: >-
    [{"table":"ingested_requests","ts_column":"received_at","retention":"0 seconds",
    "batch_size":2000,"batch_pause_ms":250}]

imagePullSecrets:
  - name: github-secret

resources:
  limits:
    cpu: "500m"
    memory: 256Mi
  requests:
    cpu: "100m"
    memory: 128Mi

nodeSelector:
  kubernetes.io/arch: amd64
