image: "ghcr.io/worldcoin/iris-mpc-genesis:2d7f9858495132358c47b00e21f3048fdbfd55b6-arm64"

environment: dev
replicaCount: 0

strategy:
  type: Recreate

datadog:
  enabled: true

hostNetwork: false

ports:
  - containerPort: 3000
    name: health
    protocol: TCP
  - containerPort: 4000
    name: tcp-4000
    protocol: TCP
  - containerPort: 4001
    name: tcp-4001
    protocol: TCP
  - containerPort: 4002
    name: tcp-4002
    protocol: TCP
  - containerPort: 4100
    name: tcp-4100
    protocol: TCP
  - containerPort: 4101
    name: tcp-4101
    protocol: TCP
  - containerPort: 4102
    name: tcp-4102
    protocol: TCP

livenessProbe:
  # genesis idles after a completed run, with no coordination server left to
  # answer: a restart here would start an unwanted pinned rerun.
  periodSeconds: 30
  failureThreshold: 10000
  httpGet:
    path: /health
    port: health

readinessProbe:
  periodSeconds: 30
  httpGet:
    path: /ready
    port: health

startupProbe:
  initialDelaySeconds: 60
  failureThreshold: 360
  periodSeconds: 30
  httpGet:
    path: /ready
    port: health

resources:
  # the rehearsal fixture is ~10k serials: small requests let the pod land on an
  # existing node instead of waiting for Karpenter, which is what desynchronises
  # the three parties' startup and trips the heartbeat-init panic.
  limits:
    cpu: 8
    memory: 32Gi
  requests:
    cpu: 8
    memory: 32Gi

imagePullSecrets:
  - name: github-secret

podAnnotations:
  karpenter.sh/do-not-disrupt: "true"
  rollme: "wal-replay-1"

nodeSelector:
  kubernetes.io/arch: arm64
  karpenter.sh/capacity-type: on-demand
  node.kubernetes.io/instance-type: "x8g.8xlarge"

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534

preStop:
  # preStop.sleepPeriod specifies the time spent in Terminating state before SIGTERM is sent
  sleepPeriod: 10

# terminationGracePeriodSeconds specifies the grace time between SIGTERM and SIGKILL
# long enough to allow for graceful shutdown to safely process 2 batches
# single batch timeout in stage is 240 seconds
# the rehearsal needs a prompt abort: genesis does not honour SIGTERM during
# setup or the delta, so a long grace period lets an aborted run finish.
terminationGracePeriodSeconds: 5

mountSSLCerts:
  enabled: true
  mountPath: /etc/ssl/private
