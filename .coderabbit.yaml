# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Keep unspecified settings inherited; inspect the resolved config with @coderabbitai configuration.
inheritance: true
reviews: 
  profile: chill
  high_level_summary_in_walkthrough: true
  review_details: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  path_instructions: 
    - path: "**/*"
      instructions: "Report actionable correctness, security, data-integrity and reliability defects introduced by this change. Trace relevant callers and failure paths before asserting a bug; cite the code or contract and explain impact. Avoid speculative requirements, style-only churn and duplicate findings from existing CI. For cross-repository claims, identify the source and relevant dependency revision; default-branch context is not proof of deployed compatibility. If context is unavailable, state the uncertainty rather than inventing a contract."
    - path: iris-mpc*/**
      instructions: "For protocol and matching changes compare CPU/HNSW and GPU behavior where applicable. Check party synchronization, share/serial ownership, persistence versus result publication, restart/replay and bounded batching. Check shared dependency revisions before assuming linked main matches the deployed caller."
    - path: migrations/**
      instructions: "Check schema changes against old and new binaries, migration history validation, rolling upgrades, rollback and retention required by recovery."
    - path: "{deploy/**,.github/workflows/**,**/Dockerfile*}"
      instructions: "Check stage/production targeting, permissions and secret handling, dependency/image revisions, rollout compatibility, startup/readiness behavior and rollback. Flag only risks supported by the actual configuration and deployment path."
chat: 
  art: false
knowledge_base: 
  automatic_linking_mode: auto
  linked_repositories: 
    - repository: worldcoin/ampc-common
      instructions: "Shared Rust MPC actor/server utilities, secret sharing and anonymous-statistics storage. Check the actual pinned revision, wire formats, migrations and startup compatibility."
