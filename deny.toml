[graph]
# Cargo deny will check dependencies via `--all-features`
all-features = true

[bans]
multiple-versions = "warn"

# Deny multiple versions of metrics - having multiple versions causes metrics
# to use separate global recorders, silently breaking metrics collection.
[[bans.deny]]
name = "metrics"
deny-multiple-versions = true
reason = "metrics crate uses a global recorder - multiple versions may break metrics silently"

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2021-0137", reason = "we will switch to alkali eventually" },
    # https://github.com/mehcode/config-rs/issues/563
    { id = "RUSTSEC-2024-0436", reason = "deep subdependency from several aws and sqlx crates" },
    # rustls-pemfile is required by reqwest and tonic, we will switch once they do
    { id = "RUSTSEC-2025-0134", reason = "No mature alternative available yet" },
    # bincode is no longer maintained, but it's considered finalized by the authors; we can switch to a maintained alternative at some point
    { id = "RUSTSEC-2025-0141", reason = "stable even if no longer maintained" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 pulled transitively through aws-sdk-s3 (every release up to current 1.142.0 caps lru at ^0.16.3); potential use-after-free from missing panic safety in LruCache::pop() — reachable only if the cached value's Drop panics mid-pop. iris-mpc does not use lru directly; aws-sdk-s3 uses it for internal endpoint/credential caching whose value types have non-panicking drops. Fixed in lru >=0.18.2, unreachable until aws-sdk-s3 widens its bound; drop once it does." },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.26.0 quadratic-attribute-check DoS; reached only via pprof 0.15 -> inferno ^0.11 (flamegraph feature, transitively through ampc-server-utils), which is unbumpable (every pprof release pins inferno ^0.11 -> quick-xml ^0.26; patched only in quick-xml >=0.41.0). Not exploitable: inferno uses quick-xml solely to GENERATE flamegraph SVGs from our own profiling data, never to parse untrusted XML via the vulnerable Attributes/NsReader read paths. Matches the ampc-common ignore; drop once pprof widens its inferno bound." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.26.0 NsReader unbounded namespace-declaration alloc DoS; same chain (pprof 0.15 -> inferno ^0.11 -> quick-xml ^0.26, patched >=0.41.0, unbumpable) and same reachability (flamegraph SVG generation from our own data, no untrusted-XML parse). Matches the ampc-common ignore; drop once pprof widens its inferno bound." },
]

[sources]
unknown-registry = "deny"

[licenses]
version = 2
# We want really high confidence when inferring licenses from text
confidence-threshold = 1.0

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LicenseRef-ring",
    "MIT",
    "MPL-2.0", # Although this is copyleft, it is scoped to modifying the original files
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "CDDL-1.0",
    "CDLA-Permissive-2.0"
]

# See https://github.com/briansmith/ring/blob/95948b3977013aed16db92ae32e6b8384496a740/deny.toml#L12
[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# The nix crate is MIT licensed. The GPL-2.0 file detected in the source tree
# is a test fixture (test/test_kmod/hello_mod/hello.c) that is not part of the
# compiled library and does not affect the license of code linking against nix.
[[licenses.clarify]]
name = "nix"
expression = "MIT"
license-files = [
    { path = "LICENSE", hash = 0x6ec9b2e5 },
]
